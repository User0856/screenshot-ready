<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Everything at once</title>
<style>
  @font-face { font-family: 'SlowInter'; src: url('/font/inter.woff2?delay=700&k=1') format('woff2'); font-display: block; }
  body { margin: 0; font-family: 'SlowInter', serif; overflow: hidden; }
  section { height: 900px; padding: 20px; box-sizing: border-box; }
  img { display: block; width: 400px; height: 300px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: #000; border-radius: 50%; animation: spin 1s linear infinite; }
  #onetrust-banner-sdk { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 20px; z-index: 99999; }
</style>
</head>
<body>
  <section><h1>Kitchen sink</h1><div class="spinner"></div></section>
  <section><img class="native" loading="lazy" src="/img/k1.png?color=e53935&delay=200"></section>
  <section><img class="native" loading="lazy" src="/img/k2.png?color=43a047&delay=200"></section>
  <section><img class="native" loading="lazy" src="/img/k3.png?color=1e88e5&delay=200"></section>
  <div id="onetrust-consent-sdk"><div id="onetrust-banner-sdk">We use cookies. <button onclick="window.__accepted = true">Accept</button></div></div>
</body>
</html>
