<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lazy images the browser never fetches</title>
<style>
  body { margin: 0; }
  .carousel { width: 600px; overflow: hidden; white-space: nowrap; }
  .carousel img { display: inline-block; width: 600px; height: 200px; }
  .collapsed { height: 0; overflow: hidden; margin-top: 4000px; }
  .collapsed img { display: block; width: 300px; height: 200px; }
</style>
</head>
<body>
  <div class="carousel">
    <img id="slide1" src="/img/s1.png?color=e53935"><img id="slide-far" loading="lazy" src="/img/s2.png?color=43a047" style="margin-left: 6000px">
  </div>
  <div class="collapsed"><img id="panel" loading="lazy" src="/img/p1.png?color=fdd835"></div>
</body>
</html>
