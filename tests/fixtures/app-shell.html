<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App shell</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: #fff; }
  nav { padding: 10px; border-bottom: 1px solid #ddd; }
  main { flex: 1; padding: 20px; }
  .note { font-size: 12px; color: #666; }
  .newsletter { position: fixed; bottom: 10px; left: 10px; background: #e3f2fd; padding: 10px; z-index: 30; }
</style>
</head>
<body>
  <div id="shell">
    <nav><a href="/">Dashboard</a> <a href="/reports">Reports</a></nav>
    <main><h1>Dashboard</h1><p>Charts and tables.</p>
      <p class="note" id="note">We use cookies to keep you signed in. <button>OK</button></p>
    </main>
  </div>
  <div class="newsletter" id="newsletter">Get our weekly newsletter <button>Subscribe</button> <button>Close</button></div>
</body>
</html>
